name: CI-WASM-Win

on:
  push:
    branches: [ "main" ]
    paths:
      - 'include/**'
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'tools/utils.ts'
      - 'tools/setup-vcpkg.ts'
      - 'tools/build/build-utils.ts'
      - 'tools/build/build-WASM.ts'
      - 'tools/routes.ts'
      - 'tools/package.json'
      - '.github/actions/base-setup/action.yml'
      - '.github/workflows/CI-WASM-Win.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Setup Emscripten
      uses: emscripten-core/setup-emsdk@v16
      with:
        version: 3.1.65

    - name: Base setup
      uses: ./.github/actions/base-setup
      with:
        target: wasm

    - name: Setup custom vcpkg
      shell: pwsh
      working-directory: ./tools
      run: |
        npm install
        npm run setup:vcpkg

    - name: Cache vcpkg binary
      id: cache-vcpkg
      uses: actions/cache@v5
      with:
        path: ${{ env.USERPROFILE }}\vcpkg-binary-cache
        key: vcpkg-binary-cache-wasm-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

    - name: Build
      shell: pwsh
      working-directory: ./tools
      run: |
        npm run build:wasm

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: WASM-Win-build
        path: |
          build.WASM/Release/output/
        if-no-files-found: error
