name: CI-macOS-Mac

on:
  push:
    branches: [ "main" ]
    paths:
      - 'include/**'
      - 'src/**'
      - 'test/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'tools/utils.ts'
      - 'tools/test/gtest-utils.ts'
      - 'tools/test/coverage-utils.ts'
      - 'tools/find-llvm.ts'
      - 'tools/setup-vcpkg.ts'
      - 'tools/build/build-utils.ts'
      - 'tools/build/build-macOS.ts'
      - 'tools/routes.ts'
      - 'tools/package.json'
      - '.github/workflows/Base-Setup.yml'
      - '.github/workflows/CI-macOS-Mac.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  baseSetup:
    uses: ./.github/workflows/Base-Setup.yml
    with:
      host: macOS
      target: macos

  build:
    needs: baseSetup
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Normalize Homebrew taps
      run: |
        if brew tap | grep -qx 'aws/tap'; then
          brew untap aws/tap
        fi

    - name: Setup LLVM
      run: |
        # The Apple toolchain builds with Xcode's clang, and its raw profiles are only
        # readable by the LLVM tools shipped in the same toolchain. Homebrew's llvm is a
        # different (newer) release and rejects them with
        #   "raw profile version mismatch: ... version = 10; expected version = 11"
        # which fails the coverage report step, so keep both ends on one toolchain.
        XCODE_TOOLCHAIN_BIN="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/bin"
        if [ ! -x "${XCODE_TOOLCHAIN_BIN}/llvm-profdata" ] || [ ! -x "${XCODE_TOOLCHAIN_BIN}/llvm-cov" ]; then
          echo "Xcode toolchain LLVM tools not found in ${XCODE_TOOLCHAIN_BIN}" >&2
          echo "Make sure llvm-profdata/llvm-cov come from the same LLVM release as the compiler." >&2
          exit 1
        fi
        echo "LLVM_HOME=${XCODE_TOOLCHAIN_BIN}" >> "$GITHUB_ENV"
        "${XCODE_TOOLCHAIN_BIN}/llvm-cov" --version
        "${XCODE_TOOLCHAIN_BIN}/llvm-profdata" --version

    - name: Setup custom vcpkg
      working-directory: ./tools
      run: |
        npm install
        npm run setup:llvm
        npm run setup:vcpkg

    - name: Cache vcpkg binary
      id: cache-vcpkg
      uses: actions/cache@v5
      with:
        path: ${{ env.HOME }}/vcpkg-binary-cache
        key: vcpkg-binary-cache-osx-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

    - name: Build
      working-directory: ./tools
      run: |
        npm run build:macos -- --test --coverage

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: macOS-Mac-build
        path: |
          build.macOS/Release/output/
        if-no-files-found: error
